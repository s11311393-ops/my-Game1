<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>接水果 (Catch It) V2.0 - 高效能狂熱版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="h-full text-white flex flex-col items-center justify-center overflow-hidden select-none">

    <div id="gameWrapper" class="w-full max-w-md h-full max-h-[880px] flex flex-col p-3 sm:p-4 bg-slate-900/90 rounded-2xl border-2 border-indigo-500/40 neon-shadow relative transition-all duration-300">
        
        <!-- Header / HUD -->
        <div class="flex justify-between items-center bg-slate-950/90 p-2.5 sm:p-3 rounded-xl border border-indigo-500/30 mb-3 shadow-lg">
            <div class="flex flex-col">
                <span class="text-[9px] text-indigo-300 uppercase tracking-wider arcade-font">分數 SCORE</span>
                <span id="scoreVal" class="text-lg sm:text-xl font-black text-amber-400 arcade-font">0</span>
            </div>
            <div class="flex flex-col items-center">
                <span class="text-[9px] text-indigo-300 uppercase tracking-wider arcade-font">等級 LEVEL</span>
                <span id="levelVal" class="text-lg sm:text-xl font-black text-cyan-400 arcade-font">1</span>
            </div>
            <div class="flex flex-col items-center">
                <span class="text-[9px] text-pink-400 uppercase tracking-wider arcade-font">連擊 COMBO</span>
                <span id="comboVal" class="text-lg sm:text-xl font-black text-pink-400 arcade-font">x1</span>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-[9px] text-indigo-300 uppercase tracking-wider arcade-font">生命 LIVES</span>
                <div id="livesContainer" class="flex gap-0.5 mt-1">
                    <!-- Lives populated by JS -->
                </div>
            </div>
        </div>

        <!-- Frenzy status bar -->
        <div id="frenzyBarContainer" class="w-full bg-slate-950 rounded-full h-2 mb-2 overflow-hidden border border-slate-800 hidden">
            <div id="frenzyFill" class="bg-gradient-to-r from-pink-500 to-cyan-400 h-full w-full transition-all duration-100"></div>
        </div>

        <!-- Canvas Container with Screen Shake wrapper -->
        <div id="canvasBox" class="relative flex-1 w-full bg-slate-950/90 rounded-xl overflow-hidden border border-indigo-500/30 shadow-inner flex items-center justify-center">
            <canvas id="gameCanvas" class="w-full h-full block cursor-crosshair"></canvas>

            <!-- Start Screen Overlay -->
            <div id="startOverlay" class="absolute inset-0 bg-slate-950/95 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20">
                <div class="w-20 h-20 bg-gradient-to-tr from-amber-400 via-pink-500 to-indigo-600 rounded-3xl flex items-center justify-center shadow-xl shadow-pink-500/30 mb-5 animate-bounce">
                    <span class="text-4xl">🧺</span>
                </div>
                <h1 class="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-pink-400 to-cyan-300 mb-2 arcade-font">接水果 V2.0</h1>
                <p class="text-xs text-slate-300 mb-6 max-w-[280px] leading-relaxed">效能優化版！Lv.5後維持掉落數量上限，改以速度提升難度，結合畫面震動與幾何粒子特效。</p>
                <button id="startBtn" class="w-full py-3.5 px-6 bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-cyan-500/40 transition-all transform active:scale-95 arcade-font text-xs tracking-wider cursor-pointer">
                    開始遊戲 START
                </button>
            </div>

            <!-- Game Over Overlay -->
            <div id="gameOverOverlay" class="absolute inset-0 bg-slate-950/95 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20 hidden">
                <div class="text-4xl mb-2 animate-pulse">💥</div>
                <h2 class="text-xl sm:text-2xl font-black text-rose-500 mb-1 arcade-font">遊戲結束</h2>
                <p class="text-xs text-slate-400 mb-4">Game Over</p>
                
                <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-4 w-full max-w-[240px] mb-6 space-y-2 shadow-lg">
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-400">最終得分</span>
                        <span id="finalScore" class="font-bold text-amber-400 arcade-font">0</span>
                    </div>
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-400">最高紀錄</span>
                        <span id="highScore" class="font-bold text-cyan-400 arcade-font">0</span>
                    </div>
                </div>

                <button id="restartBtn" class="w-full max-w-[240px] py-3.5 px-6 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-500/40 transition-all transform active:scale-95 arcade-font text-xs tracking-wider cursor-pointer">
                    再玩一次 RETRY
                </button>
            </div>
        </div>

        <!-- Footer / Controls -->
        <div class="mt-3 flex justify-between items-center text-[11px] text-slate-400 px-1">
            <span>💡 鍵盤左右鍵 / 觸控拖曳移動</span>
            <button id="soundToggle" class="bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800 text-slate-300 hover:text-white transition flex items-center gap-1.5 cursor-pointer">
                <span>🔊 音效開</span>
            </button>
        </div>
    </div>

    <!-- ES6 模組載入 -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
